<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bug Emoji Picker</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <form id="bug-form">
                <label for="species">Species:</label>
                <select id="species">
                    <option value="bee" selected>🐝 Cosmetic</option>
                    <option value="spider">🕷️ Low</option>
                    <option value="lion">🦁 Medium</option>
                    <option value="elephant">🐘 High</option>
                    <option value="rhino">🦏 Major</option>
                </select>
            </form>
            <div>
                <p id="bug-emoji">🐝</p>
            </div>
        </main>
    </body>
    <script src="index.js"></script>
</html>
